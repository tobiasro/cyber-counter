<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Counter">
<link rel="manifest" href="manifest.json">
<title>Game Counter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; }
  .app { display:flex; flex-direction:column; width:100vw; height:100vh; }

  .player {
    flex:1; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden; user-select:none;
  }
  .player::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 45%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 75%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 42% 38%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 5%  50%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(2px 2px at 92% 20%, rgba(255,255,255,0.3) 0%, transparent 100%);
  }
  .player.top {
    background: radial-gradient(ellipse at 50% 70%, #0a2a5e 0%, #050e2a 70%, #02060f 100%);
    transform:rotate(180deg);
  }
  .player.bottom {
    background: radial-gradient(ellipse at 50% 30%, #3a0a0a 0%, #1a0505 70%, #0a0202 100%);
  }
  .player.top::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, #00aaff, #0066ff, #00aaff, transparent);
    box-shadow: 0 0 12px #00aaff;
  }
  .player.bottom::after {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, #ff4400, #ff2200, #ff4400, transparent);
    box-shadow: 0 0 12px #ff3300;
  }

  .score {
    font-family:'Orbitron', monospace;
    font-size: clamp(80px, 25vw, 150px);
    font-weight:900; color:white; z-index:1;
    transition:transform .1s ease; letter-spacing:-2px;
  }
  .player.top    .score { text-shadow: 0 0 30px #00aaff, 0 0 60px #0055ff, -2px -2px 0 #003, 2px 2px 0 #003; }
  .player.bottom .score { text-shadow: 0 0 30px #ff4400, 0 0 60px #cc2200, -2px -2px 0 #300, 2px 2px 0 #300; }
  .score.bump { transform:scale(1.1); }

  .player-label {
    position:absolute; font-family:'Rajdhani', sans-serif; font-size:13px;
    letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.4);
    pointer-events:none;
  }
  .player.top    .player-label { bottom:12px; left:50%; transform:translateX(-50%); }
  .player.bottom .player-label { top:12px;    left:50%; transform:translateX(-50%); }

  .btn-score {
    position:absolute; width:62px; height:62px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(4px);
    color:white; font-size:32px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:2; transition:all .15s;
    font-family:'Rajdhani', sans-serif;
  }
  .player.top    .btn-score:active { background:rgba(0,170,255,0.25); border-color:#00aaff; box-shadow:0 0 12px #00aaff; }
  .player.bottom .btn-score:active { background:rgba(255,80,0,0.25);  border-color:#ff4400; box-shadow:0 0 12px #ff3300; }
  .btn-minus { left:14px; }
  .btn-plus  { right:14px; }

  .delta {
    position:absolute; font-size:20px; font-weight:bold; color:white;
    font-family:'Orbitron', monospace;
    pointer-events:none; opacity:0; z-index:10;
    left:50%; top:36%; transform:translateX(-50%);
  }
  .delta.show { animation:floatUp .9s ease forwards; }
  @keyframes floatUp {
    0%   { opacity:1; transform:translateX(-50%) translateY(0); }
    100% { opacity:0; transform:translateX(-50%) translateY(-36px); }
  }

  .toolbar {
    height:52px; flex-shrink:0; position:relative; z-index:10;
    background: linear-gradient(180deg, #0a0a0f 0%, #111118 100%);
    border-top:1px solid rgba(255,255,255,0.08);
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:space-between; padding:0 20px;
  }
  .toolbar-btn {
    background:none; border:none; color:rgba(255,255,255,0.6); font-size:20px;
    cursor:pointer; padding:8px 12px; border-radius:8px; transition:all .15s;
    font-family:'Rajdhani', sans-serif; letter-spacing:1px;
  }
  .toolbar-btn:active { color:white; background:rgba(255,255,255,0.1); }

  .coin {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:46px; height:46px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #ffe066, #b8860b);
    border:2px solid #7a5a00;
    display:flex; align-items:center; justify-content:center;
    font-size:21px; cursor:pointer; z-index:20;
    box-shadow:0 0 16px rgba(200,150,0,0.5), 0 2px 8px rgba(0,0,0,0.6);
    transition:filter .15s;
  }
  .coin:active { filter:brightness(1.3); }

  .popup-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.8); z-index:100;
    align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
  }
  .popup-overlay.open { display:flex; }

  .popup {
    background: linear-gradient(160deg, #0d1a2e 0%, #0a0a14 100%);
    border:1px solid rgba(0,150,255,0.25);
    border-radius:20px; padding:24px 22px 28px;
    width:min(300px, 88vw); color:white;
    box-shadow:0 0 40px rgba(0,100,255,0.2), 0 20px 60px rgba(0,0,0,0.8);
  }
  .popup-title {
    font-family:'Orbitron', monospace; font-size:15px; font-weight:700;
    color:#00aaff; text-align:center; letter-spacing:3px; margin-bottom:20px;
    text-shadow:0 0 10px #00aaff;
  }

  .setting-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.08);
    margin-bottom:18px;
  }
  .setting-label {
    font-family:'Rajdhani', sans-serif; font-size:15px; color:#aac8ff; letter-spacing:1px;
  }
  .setting-label small { display:block; font-size:11px; color:#556; margin-top:2px; }

  .stepper { display:flex; align-items:center; gap:12px; }
  .stepper-btn {
    width:34px; height:34px; border-radius:8px;
    border:1px solid rgba(0,150,255,0.3); background:rgba(0,100,255,0.1);
    color:#00aaff; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .stepper-btn:active { background:rgba(0,150,255,0.3); box-shadow:0 0 10px #0080ff; }
  .stepper-val {
    font-family:'Orbitron', monospace; font-size:20px; font-weight:700;
    color:#ffe066; min-width:36px; text-align:center;
  }

  .dice-section { display:flex; flex-direction:column; align-items:center; gap:0; }
  .dice-label-title {
    font-family:'Rajdhani', sans-serif; font-size:13px; letter-spacing:2px;
    color:#556; text-transform:uppercase; margin-bottom:10px;
  }

  .die-row {
    display:flex; align-items:center; justify-content:space-between;
    width:100%; padding:8px 4px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .die-row:last-of-type { border-bottom:none; margin-bottom:8px; }

  .die-player {
    font-family:'Rajdhani', sans-serif; font-size:14px; letter-spacing:2px;
    color:#aac8ff; flex:1;
  }
  .die-face {
    font-size:46px; line-height:1; flex:0 0 56px; text-align:center;
    filter: drop-shadow(0 0 6px currentColor);
  }
  #die1 { color: #00aaff; }
  #die2 { color: #ff4422; }

  .die-result {
    font-family:'Orbitron', monospace; font-size:22px; font-weight:700;
    color:#ffe066; flex:0 0 40px; text-align:right;
    text-shadow:0 0 8px rgba(255,200,0,0.5);
  }

  .roll-btn {
    margin-top:4px; width:100%;
    background: linear-gradient(135deg, #0055cc, #0033aa);
    border:1px solid #0077ff; color:white;
    padding:12px; border-radius:12px;
    font-family:'Orbitron', monospace; font-size:14px; letter-spacing:2px;
    cursor:pointer; transition:all .15s;
    box-shadow:0 0 16px rgba(0,100,255,0.3);
  }
  .roll-btn:active { background:linear-gradient(135deg,#0077ff,#0055cc); box-shadow:0 0 24px rgba(0,150,255,0.5); }

  .popup-close {
    margin-top:14px; width:100%; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.4);
    padding:9px; border-radius:10px; font-size:14px; cursor:pointer;
    font-family:'Rajdhani', sans-serif; letter-spacing:1px; transition:all .15s;
  }
  .popup-close:active { background:rgba(255,255,255,0.1); color:white; }

  .confirm-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85);
    z-index:200; align-items:center; justify-content:center; backdrop-filter:blur(4px);
  }
  .confirm-overlay.open { display:flex; }
  .confirm-box {
    background:linear-gradient(160deg,#1a0a0a,#0a0808);
    border:1px solid rgba(255,60,0,0.3); border-radius:20px;
    padding:28px 24px; text-align:center; color:white; width:240px;
    box-shadow:0 0 30px rgba(255,50,0,0.2);
  }
  .confirm-box h2 { font-family:'Orbitron', monospace; font-size:16px; color:#ff4422; margin-bottom:8px; letter-spacing:2px; }
  .confirm-box p  { color:#886; margin-bottom:20px; font-size:13px; font-family:'Rajdhani',sans-serif; letter-spacing:1px; }
  .confirm-btns { display:flex; gap:10px; }
  .confirm-btns button { flex:1; padding:10px; border-radius:10px; border:none; font-size:15px; cursor:pointer; font-family:'Rajdhani',sans-serif; letter-spacing:1px; }
  .btn-cancel { background:#222; color:#aaa; border:1px solid #444; }
  .btn-ok     { background:linear-gradient(135deg,#cc2200,#991100); color:white; box-shadow:0 0 12px rgba(200,30,0,0.4); }
</style>
</head>
<body>
<div class="app">

  <div class="player top">
    <div class="player-label">Player 1</div>
    <button class="btn-score btn-minus" onclick="change(1,-1)">−</button>
    <div class="score" id="score1">30</div>
    <div class="delta" id="delta1"></div>
    <button class="btn-score btn-plus"  onclick="change(1,1)">+</button>
  </div>

  <div class="toolbar">
    <button class="toolbar-btn" onclick="showConfirm()">↺ RESET</button>
    <div class="coin" onclick="openSettings()">⚙</div>
  </div>

  <div class="player bottom">
    <div class="player-label">Player 2</div>
    <button class="btn-score btn-minus" onclick="change(2,-1)">−</button>
    <div class="score" id="score2">30</div>
    <div class="delta" id="delta2"></div>
    <button class="btn-score btn-plus"  onclick="change(2,1)">+</button>
  </div>
</div>

<div class="popup-overlay" id="settingsModal" onclick="handleOverlayClick(event)">
  <div class="popup" id="settingsBox">
    <div class="popup-title">⚙ SETTINGS</div>
    <div class="setting-row">
      <div class="setting-label">Starting Points<small>Resets both players</small></div>
      <div class="stepper">
        <button class="stepper-btn" onclick="changeLife(-5)">−</button>
        <div class="stepper-val" id="lifeDisplay">30</div>
        <button class="stepper-btn" onclick="changeLife(5)">+</button>
      </div>
    </div>
    <div class="dice-section">
      <div class="dice-label-title">🎲 Roll Dice</div>
      <div class="die-row">
        <div class="die-player">P1</div>
        <div class="die-face" id="die1">⚀</div>
        <div class="die-result" id="res1">—</div>
      </div>
      <div class="die-row">
        <div class="die-player">P2</div>
        <div class="die-face" id="die2">⚀</div>
        <div class="die-result" id="res2">—</div>
      </div>
      <button class="roll-btn" onclick="rollBoth()">ROLL</button>
    </div>
    <button class="popup-close" onclick="closeSettings()">CLOSE</button>
  </div>
</div>

<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-box">
    <h2>RESET?</h2>
    <p>Both players reset to <span id="confirmLife">30</span> points.</p>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn-ok"     onclick="doReset()">Reset</button>
    </div>
  </div>
</div>

<script>
  const diceFaces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  let scores = [30, 30];
  let startLife = 30;
  let rolling = false;

  const STORAGE_KEY = 'game-counter-state';
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ scores, startLife })); } catch (e) {}
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (s && Array.isArray(s.scores) && s.scores.length === 2 && s.scores.every(Number.isFinite)
          && Number.isFinite(s.startLife)) {
        scores = s.scores;
        startLife = s.startLife;
      }
    } catch (e) {}
    document.getElementById('score1').textContent = scores[0];
    document.getElementById('score2').textContent = scores[1];
    document.getElementById('lifeDisplay').textContent = startLife;
  }

  function change(player, delta) {
    const i = player - 1;
    scores[i] += delta;
    const el = document.getElementById('score' + player);
    el.textContent = scores[i];
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 150);
    const d = document.getElementById('delta' + player);
    d.textContent = (delta > 0 ? '+' : '') + delta;
    d.classList.remove('show'); void d.offsetWidth; d.classList.add('show');
    save();
  }

  function changeLife(delta) {
    startLife = Math.max(1, startLife + delta);
    document.getElementById('lifeDisplay').textContent = startLife;
    scores = [startLife, startLife];
    document.getElementById('score1').textContent = startLife;
    document.getElementById('score2').textContent = startLife;
    save();
  }

  function openSettings() {
    document.getElementById('res1').textContent = '—';
    document.getElementById('res2').textContent = '—';
    document.getElementById('die1').textContent = '⚀';
    document.getElementById('die2').textContent = '⚀';
    document.getElementById('settingsModal').classList.add('open');
  }
  function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
  function handleOverlayClick(e) { if (e.target === document.getElementById('settingsModal')) closeSettings(); }

  function rollBoth() {
    if (rolling) return;
    rolling = true;
    const d1 = document.getElementById('die1'), r1 = document.getElementById('res1');
    const d2 = document.getElementById('die2'), r2 = document.getElementById('res2');
    r1.textContent = ''; r2.textContent = '';
    let ticks = 0;
    const interval = setInterval(() => {
      d1.textContent = diceFaces[Math.floor(Math.random() * 6)];
      d2.textContent = diceFaces[Math.floor(Math.random() * 6)];
      ticks++;
      if (ticks >= 14) {
        clearInterval(interval);
        const roll1 = Math.floor(Math.random() * 6) + 1;
        const roll2 = Math.floor(Math.random() * 6) + 1;
        d1.textContent = diceFaces[roll1 - 1];
        d2.textContent = diceFaces[roll2 - 1];
        r1.textContent = roll1;
        r2.textContent = roll2;
        rolling = false;
      }
    }, 55);
  }

  function showConfirm() {
    document.getElementById('confirmLife').textContent = startLife;
    document.getElementById('confirmModal').classList.add('open');
  }
  function closeConfirm() { document.getElementById('confirmModal').classList.remove('open'); }
  function doReset() {
    closeConfirm();
    scores = [startLife, startLife];
    document.getElementById('score1').textContent = startLife;
    document.getElementById('score2').textContent = startLife;
    save();
  }

  load();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
