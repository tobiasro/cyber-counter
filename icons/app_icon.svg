<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#02060f"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00aaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4422" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4422" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueDice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33bbff"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
    <linearGradient id="redDice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6644"/>
      <stop offset="100%" stop-color="#aa1100"/>
    </linearGradient>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="80"  cy="90"  r="2" fill="white" opacity="0.7"/>
  <circle cx="150" cy="50"  r="1.5" fill="white" opacity="0.5"/>
  <circle cx="400" cy="80"  r="2" fill="white" opacity="0.6"/>
  <circle cx="440" cy="150" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="60"  cy="380" r="2" fill="white" opacity="0.5"/>
  <circle cx="460" cy="400" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="350" cy="450" r="2" fill="white" opacity="0.4"/>
  <circle cx="100" cy="460" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="300" cy="60"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="200" cy="440" r="2" fill="white" opacity="0.3"/>

  <!-- Glow halos -->
  <circle cx="175" cy="230" r="110" fill="url(#blueGlow)"/>
  <circle cx="337" cy="290" r="110" fill="url(#redGlow)"/>

  <!-- Divider line -->
  <line x1="60" y1="262" x2="452" y2="262" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- ── Blue dice (P1, top-left) ── -->
  <g filter="url(#glow-blue)">
    <rect x="90" y="120" width="160" height="160" rx="28" ry="28" fill="url(#blueDice)" stroke="#00aaff" stroke-width="3"/>
    <!-- top face sheen -->
    <rect x="90" y="120" width="160" height="50" rx="28" ry="28" fill="rgba(255,255,255,0.08)"/>
    <!-- dots: 5-face pattern -->
    <circle cx="135" cy="165" r="13" fill="white" opacity="0.95"/>
    <circle cx="205" cy="165" r="13" fill="white" opacity="0.95"/>
    <circle cx="170" cy="200" r="13" fill="white" opacity="0.95"/>
    <circle cx="135" cy="235" r="13" fill="white" opacity="0.95"/>
    <circle cx="205" cy="235" r="13" fill="white" opacity="0.95"/>
  </g>

  <!-- ── Red dice (P2, bottom-right) ── -->
  <g filter="url(#glow-red)">
    <rect x="262" y="232" width="160" height="160" rx="28" ry="28" fill="url(#redDice)" stroke="#ff4422" stroke-width="3"/>
    <!-- top face sheen -->
    <rect x="262" y="232" width="160" height="50" rx="28" ry="28" fill="rgba(255,255,255,0.08)"/>
    <!-- dots: 3-face pattern -->
    <circle cx="307" cy="277" r="13" fill="white" opacity="0.95"/>
    <circle cx="342" cy="312" r="13" fill="white" opacity="0.95"/>
    <circle cx="377" cy="347" r="13" fill="white" opacity="0.95"/>
  </g>

  <!-- Gold centre ring -->
  <circle cx="256" cy="262" r="24" fill="radial-gradient(#ffe066,#b8860b)" stroke="#ffe066" stroke-width="2" opacity="0.9"/>
  <circle cx="256" cy="262" r="24" fill="#b8860b"/>
  <circle cx="256" cy="262" r="22" fill="none" stroke="#ffe066" stroke-width="2"/>
  <text x="256" y="270" text-anchor="middle" font-size="22" fill="#ffe066" font-family="serif" font-weight="bold">⚙</text>
</svg>
